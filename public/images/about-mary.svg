<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 640" role="img" aria-label="أيقونة السيدة العذراء مريم الصائمة">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DFF5FC"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="veil2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8CCFE8"/>
      <stop offset="100%" stop-color="#4E9EC2"/>
    </linearGradient>
    <linearGradient id="robe2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDFDFF"/>
      <stop offset="100%" stop-color="#E3F0F8"/>
    </linearGradient>
  </defs>

  <rect width="560" height="640" fill="url(#bg2)"/>

  <g fill="rgba(140,207,232,0.5)">

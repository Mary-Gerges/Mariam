    <circle cx="110" cy="200" r="2"/><circle cx="470" cy="230" r="2.5"/>
    <circle cx="60" cy="520" r="2"/><circle cx="500" cy="500" r="3"/>
    <circle cx="150" cy="580" r="2.5"/><circle cx="420" cy="590" r="2"/>
  </g>

  <circle cx="280" cy="300" r="240" fill="rgba(255,247,230,0.5)"/>
  <circle cx="280" cy="230" r="130" fill="rgba(255,247,230,0.7)"/>
  <circle cx="280" cy="230" r="150" fill="none" stroke="rgba(201,168,106,0.5)" stroke-width="1.5"/>

  <!-- الحجاب والجسم -->
  <path d="M280 190 Q320 200 328 250 Q334 300 322 370 Q314 440 310 560 Q280 566 280 560 Q280 566 250 560 Q246 440 238 370 Q226 300 232 250 Q240 200 280 190 Z" fill="url(#veil2)"/>

  <!-- الجسم -->
  <path d="M280 380 Q330 390 350 430 Q342 520 330 570 Q310 610 280 610 Q250 610 230 570 Q218 520 210 430 Q230 390 280 380 Z" fill="url(#robe2)"/>

  <!-- الوجه -->
  <path d="M262 225 Q280 214 298 225 Q301 240 298 251 Q280 262 262 251 Q259 240 262 225 Z" fill="#F6E3CE"/>

  <!-- خطوط الحجاب -->
  <path d="M280 195 Q305 212 310 250 Q314 290 304 350" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="3"/>
  <path d="M280 195 Q255 212 250 250 Q246 290 256 350" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="3"/>

  <!-- هالة ذهبية رفيعة -->
  <circle cx="280" cy="230" r="58" fill="none" stroke="rgba(201,168,106,0.55)" stroke-width="2.5"/>

  <!-- نجوم -->
  <g fill="#C9A86A">
    <path d="M280 120 l5 13 14 1 -11 9 3 14 -11 -7 -11 7 3 -14 -11 -9 14 -1 Z"/>
    <path d="M150 300 l3 9 10 1 -8 6 2 9 -7 -5 -7 5 2 -9 -8 -6 10 -1 Z" opacity="0.5"/>
    <path d="M420 300 l3 9 10 1 -8 6 2 9 -7 -5 -7 5 2 -9 -8 -6 10 -1 Z" opacity="0.5"/>
  </g>

  <!-- يد متمسكة بالصلاة -->
  <g transform="translate(280 430)">
    <ellipse cx="0" cy="0" rx="14" ry="20" fill="#F6E3CE"/>
    <path d="M-4 -16 l8 0 M-4 -10 l8 0 M-4 -4 l8 0" stroke="#D8A97E" stroke-width="2" fill="none"/>
  </g>

  <!-- وردة بيضاء -->
  <g transform="translate(430 530)">
    <circle cx="0" cy="0" r="12" fill="rgba(255,255,255,0.9)" stroke="#C9A86A" stroke-width="1.5"/>
